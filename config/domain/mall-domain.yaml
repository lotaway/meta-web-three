owner_domain: mall-domain
description: 商城域 - 商品、订单、购物车、促销、支付、用户
services:
  mall-catalog-service:
    allowed_tables:
      - products
      - product_sku
      - product_category
      - product_specs
      - product_images
    readonly_tables:
      - orders
      - inventory
      - user_actions

  mall-trade-service:
    allowed_tables:
      - orders
      - order_items
      - order_logs
      - order_addresses
      - carts
      - cart_items
      - promotions
      - coupons
      - coupon_users
      - promotion_rules
      - payments
      - refunds
      - payment_methods
    readonly_tables:
      - products
      - inventory

  mall-user-service:
    allowed_tables:
      - users
      - addresses
      - auth_tokens
      - user_profiles
      - user_actions
      - events
      - event_metrics
    readonly_tables:
      - products
