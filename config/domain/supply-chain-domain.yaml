owner_domain: supply-chain-domain
description: 供应链域 - 库存、仓库、物流、采购、供应商
services:
  scm-inventory-service:
    allowed_tables:
      - inventory
      - inventory_reserved
      - inventory_logs
      - inventory_snapshot
      - warehouses
      - warehouse_zones
      - locations
      - inventory_warehouse
      - suppliers
      - supplier_contacts
      - supplier_contracts
      - supplier_ratings
    readonly_tables:
      - orders
      - products

  scm-logistics-service:
    allowed_tables:
      - shipments
      - tracking_events
      - carriers
      - shipping_zones
      - purchase_orders
      - purchase_items
      - purchase_receipts
    readonly_tables:
      - orders
      - suppliers
