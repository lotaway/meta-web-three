owner_domain: platform-domain
description: 平台域 - 网关、媒体、消息、客服、佣金、数据分析、租户、开发者门户
services:
  gateway:
    readonly: true
    description: API 网关，不直接访问数据库

  platform-service:
    allowed_tables:
      - media_files
      - media_metadata
      - messages
      - notifications
      - notification_queue
      - tickets
      - ticket_replies
      - ticket_attachments
      - commissions
      - commission_logs
      - commission_rates
    readonly_tables:
      - users
      - orders
