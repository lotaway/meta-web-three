syntax = "proto3";

package com.metawebthree.supplychain.generated.rpc;

option java_multiple_files = true;

import "shared/google/type/money.proto";

service InventoryService {
    rpc getInventory(GetInventoryRequest) returns (GetInventoryResponse);
    rpc reserveInventory(ReserveInventoryRequest) returns (ReserveInventoryResponse);
    rpc releaseInventory(ReleaseInventoryRequest) returns (ReleaseInventoryResponse);
    rpc releaseInventoryByOrderId(ReleaseInventoryByOrderIdRequest) returns (ReleaseInventoryByOrderIdResponse);
    rpc confirmInventory(ConfirmInventoryRequest) returns (ConfirmInventoryResponse);
    rpc stockIn(StockInRequest) returns (StockInResponse);
}

message GetInventoryRequest {
    int64 productId = 1;
    string warehouseCode = 2;
}

message GetInventoryResponse {
    int64 productId = 1;
    string warehouseCode = 2;
    int32 availableQty = 3;
    int32 reservedQty = 4;
    int32 totalQty = 5;
}

message ReserveInventoryRequest {
    int64 orderId = 1;
    int64 productId = 2;
    string warehouseCode = 3;
    int32 quantity = 4;
}

message ReserveInventoryResponse {
    bool success = 1;
    string message = 2;
    string reservationId = 3;
}

message ReleaseInventoryRequest {
    string reservationId = 1;
}

message ReleaseInventoryByOrderIdRequest {
    int64 orderId = 1;
    string reason = 2;
}

message ReleaseInventoryByOrderIdResponse {
    bool success = 1;
    string message = 2;
    int32 releasedCount = 3;
}

message ConfirmInventoryRequest {
    int64 orderId = 1;
}

message ConfirmInventoryResponse {
    bool success = 1;
    string message = 2;
}

message ReleaseInventoryResponse {
    bool success = 1;
    string message = 2;
}

// Records physically accepted goods back into sellable stock. The business
// key is derived from the RMA (rmaNo + skuCode) so that replaying the same
// return never increases stock twice.
message StockInRequest {
    int64 rmaId = 1;
    string rmaNo = 2;
    string skuCode = 3;
    int32 quantity = 4;
    int64 warehouseId = 5;
}

message StockInResponse {
    bool success = 1;
    // True when the same RMA line had already been stocked in (idempotent replay).
    bool duplicated = 2;
    string message = 3;
    int32 quantity = 4;
}
