syntax = "proto3";

package com.metawebthree.supplychain.generated.rpc;

option java_multiple_files = true;

import "shared/google/type/money.proto";

enum ProcurementStatus {
    PROCUREMENT_STATUS_UNSPECIFIED = 0;
}

service ProcurementService {
    rpc createPurchaseOrder(CreatePurchaseOrderRequest) returns (CreatePurchaseOrderResponse);
    rpc getPurchaseOrder(GetPurchaseOrderRequest) returns (GetPurchaseOrderResponse);
    rpc approvePurchaseOrder(ApprovePurchaseOrderRequest) returns (ApprovePurchaseOrderResponse);
    rpc receivePurchaseOrder(ReceivePurchaseOrderRequest) returns (ReceivePurchaseOrderResponse);
}

// Supplier portal reads, migrated from Feign. Kept separate from
// ProcurementService so the write-side contract is unchanged.
service SupplierOrderService {
    rpc listSupplierOrders(ListSupplierOrdersRequest) returns (ListSupplierOrdersResponse);
    rpc getSupplierOrder(GetSupplierOrderRequest) returns (GetSupplierOrderResponse);
}

message CreatePurchaseOrderRequest {
    string supplierCode = 1;
    repeated PurchaseOrderItem items = 2;
    int64 expectedDeliveryDate = 3;
    string remark = 4;
}

message PurchaseOrderItem {
    int64 productId = 1;
    int32 quantity = 2;
    google.type.Money unitPrice = 3;
}

message CreatePurchaseOrderResponse {
    string purchaseOrderNo = 1;
    bool success = 2;
    string message = 3;
}

message GetPurchaseOrderRequest {
    string purchaseOrderNo = 1;
}

message GetPurchaseOrderResponse {
    string purchaseOrderNo = 1;
    string supplierCode = 2;
    repeated PurchaseOrderItem items = 3;
    ProcurementStatus status = 4;
    int64 expectedDeliveryDate = 5;
    google.type.Money totalAmount = 6;
}

message ApprovePurchaseOrderRequest {
    string purchaseOrderNo = 1;
    int64 approverId = 2;
    bool approved = 3;
    string comment = 4;
}

message ApprovePurchaseOrderResponse {
    bool success = 1;
    string message = 2;
}

message ReceivePurchaseOrderRequest {
    string purchaseOrderNo = 1;
    string warehouseCode = 2;
    map<int64, int32> receivedQtys = 3;
}

message ReceivePurchaseOrderResponse {
    string inboundOrderNo = 1;
    bool success = 2;
    string message = 3;
}

// Supplier portal order view. Mirrors ProcurementOrderDTO fields that the
// portal maps into SupplierPortalOrderDTO; timestamps are epoch millis.
message SupplierOrderView {
    string orderNo = 1;
    string supplierCode = 2;
    string supplierName = 3;
    string purchaseType = 4;
    string status = 5;
    string totalAmount = 6;
    string currency = 7;
    string paymentTerms = 8;
    string deliveryTerms = 9;
    string remark = 10;
    int64 expectedDeliveryDate = 11;
    int64 actualDeliveryDate = 12;
    int64 createdAt = 13;
}

message ListSupplierOrdersRequest {
    // Optional; empty means all statuses.
    string status = 1;
}

message ListSupplierOrdersResponse {
    repeated SupplierOrderView orders = 1;
}

message GetSupplierOrderRequest {
    string orderNo = 1;
}

message GetSupplierOrderResponse {
    SupplierOrderView order = 1;
}
