[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solana_contract = "5Dk7wrWReetiNNcFbicN8ZFwXkrQeQu4LoMkhLJimGcP"

[surfpool]
startup_wait = 15000
shutdown_wait = 2000
rpc_port = 18999
ws_port = 19000
block_production_mode = "clock"
slot_time = 400

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]
