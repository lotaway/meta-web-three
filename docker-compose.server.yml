x-java-service: &java-service
  environment:
    - SPRING_PROFILES_ACTIVE=dev
    - SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING=zookeeper:2181
  depends_on:
    zookeeper:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - meta-web-three
    - default
  restart: unless-stopped

services:
  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: gateway
    container_name: meta-web-three-gateway
    hostname: gateway
    ports:
      - "10081:10081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING=zookeeper:2181
    volumes:
      - gateway_data:/server/gateway
      - ./.aws:/.aws:ro
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - meta-web-three
      - default
    restart: unless-stopped
  mall-catalog-service:
    <<: *java-service
    build:
      context: .
      dockerfile: server/Dockerfile
      target: mall-catalog-service
    container_name: meta-web-three-mall-catalog-service
    hostname: mall-catalog-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING=zookeeper:2181
      - AI_SHOPPING_MILVUS_HOST=milvus
    ports:
      - "10082:10082"
    volumes:
      - mall_catalog_service_data:/server/mall-catalog
      - ./.aws:/.aws:ro
  mall-user-service:
