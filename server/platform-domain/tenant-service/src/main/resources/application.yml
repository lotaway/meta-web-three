server:
  port: 10126
spring:
  application:
    name: tenant-service
  profiles:
    active: dev
dubbo:
  application:
    name: tenant-service
  protocol:
    port: 20126

notification:
  email:
    enabled: ${EMAIL_ENABLED:true}

resilience4j:
  ratelimiter:
    instances:
      tenantRegister:
        limit-refresh-period: 60s
        limit-for-period: 3
        timeout-duration: 5s

service-governance:
  rate-limiter:
    tenantCaptcha:
      enabled: true
      limit-for-period: 10
      limit-refresh-period: 60s
      timeout-duration: 5s
    tenantEmailCode:
      enabled: true
      limit-for-period: 5
      limit-refresh-period: 60s
      timeout-duration: 5s
    tenantRegister:
      enabled: true
      limit-for-period: 3
      limit-refresh-period: 60s
      timeout-duration: 5s
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-dev.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-prod.yml
