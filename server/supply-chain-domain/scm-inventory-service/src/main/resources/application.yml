server:
  port: 10105

meta:
  common:
    storage:
      kafka:
        enabled: true
spring:
  application:
    name: scm-inventory-service
  profiles:
    active: dev
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-dev.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-prod.yml
