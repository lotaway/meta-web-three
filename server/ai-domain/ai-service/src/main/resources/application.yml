server:
  port: 10103

# External AI/LLM runtimes reached by the Dubbo AICapabilityService provider.
# These are external systems (local LLM server / third-party LLM API), so HTTP
# is allowed here; endpoints are configured centrally instead of hard-coded in
# calling services.
ai:
  capabilities:
    forecasting:
      base-url: ${AI_FORECASTING_URL:http://localhost:8082}
    location:
      base-url: ${AI_LOCATION_URL:http://localhost:8083}
    anomaly:
      base-url: ${AI_ANOMALY_URL:http://localhost:8084}
    recommendation:
      base-url: ${AI_RECOMMENDATION_URL:http://localhost:8085}
    risk:
      base-url: ${AI_RISK_URL:http://localhost:8086}

meta:
  common:
    storage:
      database:
        enabled: true
      kafka:
        enabled: true
spring:
  application:
    name: ai-service
  profiles:
    active: dev
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  quartz:
    auto-startup: false
    job-store-type: memory
    jdbc:
      initialize-schema: never
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-dev.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-prod.yml
