server:
  port: 10114
spring:
  application:
    name: blockchain-service
  profiles:
    active: dev
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  quartz:
    auto-startup: false
    job-store-type: memory
    jdbc:
      initialize-schema: never
blockchain:
  evm:
    rpc-url: ${EVM_RPC_URL:https://rpc.ankr.com/eth_sepolia}
    chain-id: ${EVM_CHAIN_ID:11155111}
  solana:
    rpc-url: ${SOLANA_RPC_URL:https://api.devnet.solana.com}
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-dev.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-prod.yml
