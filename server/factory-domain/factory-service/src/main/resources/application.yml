server:
  port: 10101

meta:
  common:
    storage:
      database:
        enabled: true
      kafka:
        enabled: true
  influx:
    enabled: ${INFLUX_ENABLED:false}
    url: ${INFLUX_URL:http://localhost:8086}
    token: ${INFLUX_TOKEN:}
    org: ${INFLUX_ORG:meta}
    bucket: ${INFLUX_BUCKET:telemetry}
  telemetry:
    # Protocol-agnostic field telemetry mapping. All values are overridable per
    # deployment; defaults follow common MQTT payloads and ISA-95 UNS levels.
    source-name: ${TELEMETRY_SOURCE_NAME:FIELD}
    timestamp-field: timestamp
    quality-field: quality
    unit-field: unit
    device-code-segment: device
    # Derive the subscription topic from the single MQTT prefix source above.
    topic-patterns:
      - ${mqtt.topic.prefix}+/telemetry
    quality-values:
      good: GOOD
      ok: GOOD
      bad: BAD
      error: BAD
    simulated:
      # Demo/test-only second TelemetrySource; never enabled by default in prod.
      enabled: ${TELEMETRY_SIMULATED_ENABLED:false}
      device-code: ${TELEMETRY_SIMULATED_DEVICE:SIM-PLC-001}
      interval-ms: ${TELEMETRY_SIMULATED_INTERVAL:5000}
      tags:
        - temperature
        - vibration
        - pressure

# MQTT connection settings (top-level so MqttConfig and the conditional
# TelemetrySourceConfig bind the same properties). All values env-injected.
mqtt:
  enabled: ${MQTT_ENABLED:false}
  broker:
    url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  topic:
    prefix: ${MQTT_TOPIC_PREFIX:mes/equipment/}
spring:
  application:
    name: factory-service
  profiles:
    active: dev
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  quartz:
    auto-startup: false
    job-store-type: memory
    jdbc:
      initialize-schema: never

# factory-service is reachable only through the gateway, so REST requests must
# also carry the gateway-signed X-Internal-Token (the WS handshake already does).
internal-token:
  enabled: ${INTERNAL_TOKEN_ENABLED:true}

# AI Service Configuration
ai:
  forecasting-service:
    endpoint: ${FORECASTING_SERVICE_URL:http://localhost:8082}
    timeout-ms: ${FORECASTING_SERVICE_TIMEOUT:5000}
    retry-count: ${FORECASTING_SERVICE_RETRY:3}
  location-recommendation-service:
    endpoint: ${LOCATION_RECOMMENDATION_URL:http://localhost:8083}
    timeout-ms: ${LOCATION_RECOMMENDATION_TIMEOUT:5000}
    retry-count: ${LOCATION_RECOMMENDATION_RETRY:3}
  anomaly-detection-service:
    endpoint: ${ANOMALY_DETECTION_URL:http://localhost:8084}
    timeout-ms: ${ANOMALY_DETECTION_TIMEOUT:5000}
    retry-count: ${ANOMALY_DETECTION_RETRY:3}
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-dev.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-prod.yml
