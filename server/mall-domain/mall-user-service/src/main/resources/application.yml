server:
  port: 10083
spring:
  application:
    name: mall-user-service
  profiles:
    active: dev
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  quartz:
    auto-startup: false
    job-store-type: memory
    jdbc:
      initialize-schema: never
# RBAC 种子数据（user-service）
seed-data:
  super-admin-role-id: 3001
  default-admin-id: 1
  resource:
    start-id: 101
    end-id: 410
  menu:
    start-id: 2001
    end-id: 2042
default-admin:
  username: admin
  password: "123456"
  nickname: 超级管理员
# 外部接口密钥（user-service）
x:
  apikey: "your-api-key"
  secret: "your-secret-key"
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-dev.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-prod.yml
