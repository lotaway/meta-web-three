server:
  port: 10104
spring:
  application:
    name: recommendation-service
  profiles:
    active: dev
recommendation:
  algorithm:
    scoring:
      collaborative-weight: 0.4
      content-weight: 0.3
      hybrid-weight: 0.5
      popularity-weight: 0.6
      ai-model-weight: 0.8
      base-score: 80.0
      score-decay: 5.0
    ctr:
      industry-average: 3.5
      high-threshold: 5.0
      low-threshold: 1.0
    conversion:
      industry-average: 1.2
      high-threshold: 2.5
      low-threshold: 0.5
    batch:
      batch-size: 500
ai-shopping:
  enabled: true
  vector-store: memory
  embedding-dim: 1024
  default-top-k: 20
  # 以下 base-url/api-key/model 均支持 DB 覆盖（ai_shopping_config 表，后台可维护）
  # 兼容 OpenAI 协议；path 可自定义请求路径，默认按协议自动拼接
  embedding:
    base-url: ""
    api-key: ""
    model: ""
    path: ""
    timeout-ms: 15000
    max-retries: 2
  image-embedding:
    base-url: ""
    api-key: ""
    model: ""
    path: ""
    timeout-ms: 15000
    max-retries: 2
  llm:
    base-url: ""
    api-key: ""
    model: ""
    path: ""
    timeout-ms: 15000
    max-retries: 2
  milvus:
    host: localhost
    port: 19530
    api-token: ""
    collection-text: product_text
    collection-image: product_image
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-dev.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-prod.yml
