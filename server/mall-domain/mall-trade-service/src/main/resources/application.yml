server:
  port: 10084
spring:
  application:
    name: mall-trade-service
  profiles:
    active: dev
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  quartz:
    auto-startup: false
    job-store-type: memory
    jdbc:
      initialize-schema: never
commission:
  return-window-days: 7
# 支付配置（payment-service）
payment:
  fiat:
    # Real credentials MUST be injected from the environment / secret manager.
    # Never commit production keys here. An empty value disables the method.
    alipay:
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      public-key: ${ALIPAY_PUBLIC_KEY:}
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
      # Exact async notify URL, e.g. https://api.example.com/pay/alipay/callback
      notify-url: ${ALIPAY_NOTIFY_URL:}
      return-url: ${ALIPAY_RETURN_URL:}
    # WeChat Pay has no working unified-order integration in this build. It stays
    # disabled so no placeholder payment parameters are ever produced.
    wechat:
      enabled: ${WECHAT_PAY_ENABLED:false}
      app-id: ${WECHAT_PAY_APP_ID:}
      mch-id: ${WECHAT_PAY_MCH_ID:}
      api-key: ${WECHAT_PAY_API_KEY:}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      return-url: ${STRIPE_RETURN_URL:app://payment}
      currency: ${STRIPE_CURRENCY:cny}
    bank:
      enabled: true
      timeout-minutes: 30
  crypto:
    supported-currencies:
      - BTC
      - ETH
      - USDT
      - USDC
    wallet:
      # Credentials MUST be injected from the environment / secret manager.
      api:
        blockchain-url: ${CRYPTO_BLOCKCHAIN_API_URL:}
        wallet-sdk-url: ${CRYPTO_WALLET_SDK_URL:}
        key: ${CRYPTO_WALLET_API_KEY:}
      hot-wallet:
        btc: ${CRYPTO_BTC_HOT_WALLET:}
        eth: ${CRYPTO_ETH_HOT_WALLET:}
        usdt: ${CRYPTO_USDT_HOT_WALLET:}
      cold-wallet:
        btc: ${CRYPTO_BTC_COLD_WALLET:}
        eth: ${CRYPTO_ETH_COLD_WALLET:}
        usdt: ${CRYPTO_USDT_COLD_WALLET:}
  price-engine:
    enabled: true
    max-consecutive-failures: 3
    failure-cooldown-seconds: 60
    # Offline / air-gapped fallbacks. Leave empty in production so live market data is
    # always preferred. Set per-symbol static prices (e.g. BTC-USD: 50000) to keep the
    # price engine usable where the sandbox has no egress to the external exchanges.
    mock-prices: {}
    sources:
      - name: binance
        url: https://api.binance.com/api/v3/ticker/price
        weight: 0.4
      - name: coinbase
        url: https://api.coinbase.com/v2/prices
        weight: 0.3
      - name: okx
        url: https://www.okx.com/api/v5/market/ticker
        weight: 0.3
    update-interval: 5
  risk-control:
    single-limit:
      usd: 10000
      cny: 70000
      eur: 9000
    daily-limit:
      usd: 50000
      cny: 350000
      eur: 45000
    slippage:
      max-percentage: 2.0
  kyc:
    levels:
      l0:
        name: "基础验证"
        limit: 1000
      l1:
        name: "身份验证"
        limit: 10000
      l2:
        name: "高级验证"
        limit: 100000
      l3:
        name: "企业验证"
        limit: 1000000
  quartz:
    enabled: true
  reconciliation:
    payment-platform-api-url: ${RECONCILIATION_PAYMENT_PLATFORM_API_URL:}
    message-service-url: ${RECONCILIATION_MESSAGE_SERVICE_URL:}
    dingtalk-webhook-url: ${RECONCILIATION_DINGTALK_WEBHOOK_URL:}
    report-storage-path: ${RECONCILIATION_REPORT_STORAGE_PATH:/tmp/reconciliation-reports}
# 促销配置（promotion-service）
promotion:
  coupon:
    retry-limit: 5
    max-generate-count: 1000
    code-length: 10
    code-alphabet: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-dev.yml
---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - optional:classpath:application-common.yml
      - optional:classpath:application-common-prod.yml