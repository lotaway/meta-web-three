services:
  factory-service:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: factory-service
    container_name: factory-service
    hostname: factory-service
    # This file is used together with the root docker-compose.yml (which
    # includes docker-compose.server.yml for gateway + zookeeper and
    # docker-compose.env.yml for kafka + redis).
    # docker-compose.server.yml publishes only gateway:10081; every other Java
    # service uses `expose`, so factory-service stays inside the compose network
    # and is reached through the gateway via zookeeper service discovery.

    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=10101
      - SPRING_CLOUD_ZOOKEEPER_CONNECT_STRING=zookeeper:2181
      # Kafka runs in host network mode (see docker-compose.env.yml), so it has
      # no `kafka` DNS name on the bridge network. Reach it through the host
      # gateway and the dedicated PLAINTEXT_DOCKER listener; the broker
      # advertises host.docker.internal so clients do not get redirected to
      # their own localhost. Override KAFKA_BOOTSTRAP_SERVERS in .env for a
      # remote broker.
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9094}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - INTERNAL_TOKEN_ENABLED=true
      - INTERNAL_TOKEN_SECRET=${INTERNAL_TOKEN_SECRET:-mwt-internal-secret-2024}
      # prod profile reads its stores from application-common-prod.yml; the
      # account follows the postgres service so the two never drift apart.
      - DATASOURCE_URL=${DATASOURCE_URL:-jdbc:postgresql://postgres:5432/metawebthree}
      - DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-123123}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123123}
      # The renderer is a file:// Electron page; the gateway already validates
      # the JWT, so all handshake origins are accepted here.
      - DIGITAL_TWIN_WEBSOCKET_ALLOWED_ORIGINS=*
      - JAVA_OPTS=-Xms512m -Xmx1024m
    volumes:
      - factory_service_data:/server/factory
    # Resolve host.docker.internal to the host gateway so the bridge-network
    # service can reach the host-network Kafka broker's PLAINTEXT_DOCKER port.
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - kafka
      - redis
      - zookeeper
    networks:
      - meta-web-three
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10101/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # docker-compose.server.yml starts gateway and mall-user-service on the dev
  # profile, which would pick up the LAN-only datasource from
  # application-common-dev.yml. The digital-twin stack needs all three Java
  # services on prod with the same store settings when layered on top.
  gateway:
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATASOURCE_URL=${DATASOURCE_URL:-jdbc:postgresql://postgres:5432/metawebthree}
      - DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-123123}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123123}
  mall-user-service:
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATASOURCE_URL=${DATASOURCE_URL:-jdbc:postgresql://postgres:5432/metawebthree}
      - DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-123123}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123123}


networks:
  meta-web-three:
    driver: bridge

volumes:
  factory_service_data:
