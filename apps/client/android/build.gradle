// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// react-native-gesture-handler and react-android both ship libfbjni.so; each
// library module's androidTest APK merge otherwise fails with a duplicate
// entry. Apply pickFirst to every Android module after it has been configured.
subprojects {
  afterEvaluate { project ->
    if (project.hasProperty('android') && project.android.properties.containsKey('packagingOptions')) {
      project.android.packagingOptions.pickFirst 'lib/*/libfbjni.so'
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
