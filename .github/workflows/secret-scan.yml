name: Secret Scan

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly full-history report

permissions:
  contents: read

jobs:
  block-new-secrets:
    name: Block secrets introduced by this change
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan commits introduced by this push or PR
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'
          GITLEAKS_ENABLE_COMMENTS: 'false'

  report-full-history:
    name: Report known findings across all refs
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Report mode: --exit-code 0 keeps known historical findings from failing
      # the job, while tool errors (exit 2) still fail. New leaks are blocked by
      # the block-new-secrets job above. --redact keeps values out of CI logs.
      - name: Scan every ref
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --log-opts="--all" \
            --report-path /repo/gitleaks-history.json \
            --exit-code 0 --redact --no-banner

      - name: Summarize findings
        run: |
          python3 - <<'PY'
          import json
          import os

          path = 'gitleaks-history.json'
          if not os.path.isfile(path):
              raise SystemExit('gitleaks produced no report; check the scan step')
          with open(path, encoding='utf-8') as handle:
              findings = json.load(handle)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Full-history secret scan\n\n')
              summary.write(f'Findings: {len(findings)}\n\n')
              summary.write('This job reports known historical findings only. '
                            'Newly introduced secrets are blocked by the '
                            '`block-new-secrets` job on every push and pull request.\n\n')
              for item in findings:
                  commit = (item.get('Commit') or '?')[:12]
                  location = f"{item.get('File', '?')}:{item.get('StartLine', '?')}"
                  summary.write(f'- `{commit}` {location} ({item.get("RuleID", "?")})\n')
          print(f'full-history findings: {len(findings)}')
          PY

      - name: Upload full-history report
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-full-history
          path: gitleaks-history.json
          if-no-files-found: warn
          retention-days: 30
