name: Frontend Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/backstage-admin/**'
      - '.github/workflows/frontend-quality-gate.yml'

env:
  NODE_VERSION: '20'

jobs:
  backstage-admin-quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/backstage-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chrome for visual snapshots
        uses: browser-actions/setup-chrome@v1
      - name: Structure / a11y budgets + unit tests
        run: npm run type-check && npm test
      - name: Build
        run: npm run build-only
      - name: Start preview server
        run: npx vite preview --host 127.0.0.1 --port 4173 &
      - name: Wait for preview
        run: npx wait-on http://127.0.0.1:4173
      - name: Visual regression and a11y gate
        env:
          QUALITY_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_CHANNEL: chrome
        run: npm run test:visual
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: apps/backstage-admin/test-results
